name: knowtrace-workflow

x-auth-build: &auth-build
  context: ./services/go-user-system
  dockerfile: Dockerfile
  args:
    VERSION: ${AUTH_APP_VERSION:-dev}
    COMMIT: ${AUTH_APP_COMMIT:-embedded}
    BUILD_TIME: ${AUTH_APP_BUILD_TIME:-unknown}

x-auth-database-environment: &auth-database-environment
  DB_HOST: auth-postgres
  DB_PORT: "5432"
  DB_USER: go_user_system
  DB_PASSWORD: ${AUTH_DB_PASSWORD:?Run make init or scripts/start-all.ps1 first}
  DB_NAME: go_user_system

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: knowtrace_workflow
      POSTGRES_USER: knowtrace_workflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowtrace}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - knowtrace_workflow_postgres18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowtrace_workflow -d knowtrace_workflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  auth-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: auth_admin
      POSTGRES_PASSWORD: ${AUTH_DB_ROOT_PASSWORD:?Run make init or scripts/start-all.ps1 first}
      # 仅 init 脚本读取，用于给普通角色设口令
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Run make init or scripts/start-all.ps1 first}
      # ADR-0019 §5.6 判据 5：时区显式钉住
      TZ: UTC
      PGTZ: UTC
    volumes:
      - auth_postgres_data:/var/lib/postgresql
      - ./deploy/postgres-init/auth-db.sh:/docker-entrypoint-initdb.d/10-auth-db.sh:ro
    healthcheck:
      # 探的是**应用库 + 普通角色**：证明「应用能用」而不只是「实例活着」
      test: ["CMD-SHELL", "pg_isready -U go_user_system -d go_user_system"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  auth-redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - auth_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  auth-migrate:
    build: *auth-build
    image: knowtrace-workflow-auth:dev
    command: ["migrate", "up"]
    environment:
      <<: *auth-database-environment
    depends_on:
      auth-postgres:
        condition: service_healthy
    restart: "no"

  auth-bootstrap:
    build: *auth-build
    image: knowtrace-workflow-auth:dev
    command: ["bootstrap-admin-if-needed"]
    environment:
      <<: *auth-database-environment
      BOOTSTRAP_ADMIN_USERNAME: ${KNOWTRACE_ADMIN_USERNAME:-KnowTrace-Workflow}
      BOOTSTRAP_ADMIN_PASSWORD: ${KNOWTRACE_ADMIN_PASSWORD:-KnowTrace-Workflow@123}
      JWT_SECRET: ${AUTH_JWT_SECRET:?Run make init or scripts/start-all.ps1 first}
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
    restart: "no"

  auth:
    build: *auth-build
    image: knowtrace-workflow-auth:dev
    ports:
      - "127.0.0.1:${AUTH_BACKEND_PORT:-8082}:8082"
    environment:
      <<: *auth-database-environment
      APP_ENV: ${AUTH_APP_ENV:-development}
      APP_PORT: "8082"
      JWT_SECRET: ${AUTH_JWT_SECRET:?Run make init or scripts/start-all.ps1 first}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${AUTH_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      JWT_REFRESH_TOKEN_EXPIRE_HOURS: ${AUTH_REFRESH_TOKEN_EXPIRE_HOURS:-168}
      REGISTRATION_ENABLED: ${AUTH_REGISTRATION_ENABLED:-true}
      REDIS_ENABLED: "true"
      REDIS_ADDR: auth-redis:6379
      COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      TRUSTED_PROXIES: ${AUTH_TRUSTED_PROXIES:-}
    depends_on:
      auth-bootstrap:
        condition: service_completed_successfully
      auth-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      # scripts/linux/deploy-observability.sh 会导出
      # KNOWTRACE_APP_REVISION=$(git rev-parse HEAD) 再构建。
      # 手工构建若忘记导出，镜像里的值会是 "unknown"，
      # 核对脚本会判定为 knowtrace_app_revision_not_injected 并写进指标。
      # **不要改成运行时 environment 注入** —— 那样重建与不重建会得到同一个值，
      # 核对就永远报一致。原委见 docs/16-stage3-observability.md「运行态版本核对」。
      args:
        KNOWTRACE_APP_REVISION: ${KNOWTRACE_APP_REVISION:-unknown}
        # 构建期内存上限。在宿主机 export NODE_OPTIONS 是**到不了**容器里的，
        # 必须作为 build arg 传（Dockerfile 的 builder 阶段用 ARG/ENV 接）。
        NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=1024}
    environment:
      DATABASE_URL: postgres://knowtrace_workflow:${POSTGRES_PASSWORD:-knowtrace}@postgres:5432/knowtrace_workflow
      EVIDENCE_UPLOAD_DIR: /app/data/uploads/evidence
      AUTH_ENABLED: "true"
      AUTH_SERVICE_URL: http://auth:8082
      AUTH_REGISTRATION_ENABLED: ${AUTH_REGISTRATION_ENABLED:-true}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-mock}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-90000}
      AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-12000}
      AI_RUNNING_STALE_AFTER_MS: ${AI_RUNNING_STALE_AFTER_MS:-300000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${KNOWTRACE_HOST:-127.0.0.1}:3000:3000"
    volumes:
      - ./data/uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  knowtrace_workflow_postgres18:
  auth_postgres_data:
  auth_redis_data:
    name: go-user-system_redis_data
    external: true
