# postgres.yaml — in-cluster PostgreSQL for go-user-system
# Service name MUST match configmap postgres.host: go-user-system-postgres
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: go-user-system-postgres-pvc
  namespace: go-user-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-user-system-postgres
  namespace: go-user-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-user-system-postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: go-user-system-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: go_user_system
            - name: POSTGRES_USER
              value: go_user_system
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: go-user-system-secret
                  key: DB_PASSWORD
            - name: TZ
              value: UTC
            - name: PGTZ
              value: UTC
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - go_user_system
                - -d
                - go_user_system
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - go_user_system
                - -d
                - go_user_system
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: go-user-system-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: go-user-system-postgres
  namespace: go-user-system
spec:
  selector:
    app: go-user-system-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  type: ClusterIP
