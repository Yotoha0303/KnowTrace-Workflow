map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:8080;
    server_name knowtrace.duckdns.org;
    server_tokens off;

    client_max_body_size 25m;

    access_log /var/log/nginx/knowtrace.access.log;
    error_log  /var/log/nginx/knowtrace.error.log warn;

    # Only the local Caddy process may supply the real client address.
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "nginx ok\n";
    }

    # Prometheus scrapes the app directly on the private Compose network.
    # Never forward the metrics endpoint through the public edge.
    location = /api/metrics {
        access_log off;
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
