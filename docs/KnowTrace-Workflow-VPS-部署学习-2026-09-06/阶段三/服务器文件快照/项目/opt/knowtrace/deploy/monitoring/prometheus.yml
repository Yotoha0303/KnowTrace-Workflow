global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: knowtrace-vps

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: knowtrace-app
    metrics_path: /api/metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/metrics.token
    static_configs:
      - targets: ["app:3000"]

  - job_name: knowtrace-auth
    metrics_path: /metrics
    static_configs:
      - targets: ["auth:8082"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: knowtrace-http-internal
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://app:3000/api/health/live
          - http://app:3000/api/health/ready
          - http://auth:8082/livez
          - http://auth:8082/readyz
          - http://grafana:3000/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: knowtrace-http-public
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://knowtrace.duckdns.org/api/health/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
