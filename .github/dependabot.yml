# Dependabot 配置
#
# 为什么加这份（2026-10-06，KT-GAP-52）
# ------------------------------------
# 在此之前**没有任何 `dependabot.yml`**，Dependabot 走**默认策略**：
# 每个依赖**各开一个 PR**、**默认频率**。后果实测：
# **9 个 PR 悬着一个月**（最早的来自 8 月），其中一个（tailwindcss v4）
# 是破坏性升级、CI 红着，而**没有人看**。
#
# 「知道有多少漏洞」与「有人在修」是两件事 —— `KT-GAP-25` 只记了前者（59 个）。
# 这份配置补的是**修复通道的形状**：把「一堆零散 PR」变成
# 「每周一次、按类型分组的少量 PR」。
#
# 生态范围
# --------
# 本仓原有**两个独立的 npm 项目**：`/`（Next.js 应用，参与部署）与
# `/services/go-user-system/frontend`（上游副本，不参与部署）。
#
# **2026-10-19：后者已被删除**（issue #37 / 主应用已覆盖其全部能力：登录、注册、
# 昵称、改密、RBAC 分配角色）。现只剩 `/` 一个。
# 删除它同时消掉了两条 dependabot 告警（`postcss-selector-parser` 无同 major 修复、
# `source-map-js` 的该 manifest 副本）。
#
# 分组（groups）为什么重要
# ------------------------
# `pattern: "*"` 把 minor/patch 收进**一个** PR。这与本仓的门禁是配套的：
# 依赖 PR 的判据是 CI 全绿，而一个包含 20 个补丁升级的 PR 只需要一次判读；
# 20 个独立 PR 则要判读 20 次 —— 那正是「悬着没人看」的成因之一。
# **major 不分组**（单独一个 PR）：主版本升级要单独审，不能混在补丁里过。
#

version: 2

updates:
  # ── 根项目：Next.js 应用（参与部署）────────────────────────────────
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      # 周二 09:00（UTC）—— 错开周末与周一（周一有 weekly-check 定时任务）。
      day: tuesday
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # 补丁与次版本合并成一个 PR（要审但不必逐个）
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      # 安全更新单独一组（优先级更高，不与常规更新混在一起）
      security:
        applies-to: security-updates
        patterns: ["*"]
    # major 不分组 —— 每个主版本升级单独一个 PR，单独审。
