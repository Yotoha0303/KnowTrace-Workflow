name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Migrations, checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: knowtrace
          POSTGRES_USER: knowtrace
          POSTGRES_PASSWORD: knowtrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowtrace -d knowtrace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://knowtrace:knowtrace@localhost:5432/knowtrace
      AI_DEFAULT_PROVIDER: mock

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to an empty database
        run: pnpm db:migrate

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      # 覆盖率基线（KT-GAP-07）。
      # provider 故意**不写进 package.json**：先让 CI 每次采集，等基线稳定后再连同
      # 阈值一起固化（见 docs/08 §2.4）。版本从已装的 vitest 推导，避免与 vitest 错配。
      # 与上一步重复跑一次测试（约 +1 分钟）是有意的：`pnpm test` 是 CONTRIBUTING 的
      # 规范入口，不应因缺 provider 而失败。
      - name: Collect coverage baseline
        run: |
          VITEST_VERSION="$(node -p "require('vitest/package.json').version")"
          pnpm add -D "@vitest/coverage-v8@${VITEST_VERSION}"
          pnpm exec vitest run --coverage

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 14

      - name: Build production bundle
        run: pnpm build

  go:
    name: Go authentication service tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/go-user-system
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/go-user-system/go.mod
          cache-dependency-path: services/go-user-system/go.sum

      # 与 Makefile 的 check 目标、CONTRIBUTING 的「提交前验证」保持一致。
      # 这个 job 之前缺失，导致认证服务的 26 个测试文件不在任何自动化门里。
      # 不配 TEST_DATABASE_DSN：集成测试会 t.Skipf（见 internal/testutil/mysql.go:91），
      # 单元测试照常执行。要跑集成测试需要另配 MySQL service。
      - name: Run Go tests
        run: go test ./...

  # 认证服务的 React 前端（`services/go-user-system/frontend`）。
  # 与上面 go job 同形：**这个 job 之前也不存在**，导致它的 7 个 vitest 文件
  # （11 个用例）不在任何自动化门里 —— 根 vitest 的 include 只含 `src/**` 与 `tests/**`，
  # 这个目录两边都不是；CI 的三个 job 没有一个碰它。
  #
  # 它**不是本部署的运行时组件**：compose 无对应服务、go-user-system 的 Dockerfile
  # 只编译 Go 二进制、nginx/Caddy 也不引用它。加门不等于把它变成线上件 ——
  # 理由是「受版本控制的测试必须在门里」，见十环 `KT-GAP-32`。
  #
  # 为什么用 npm 而不是 pnpm：该目录是 `git subtree` 引入的上游仓库副本，
  # 自带 `package-lock.json`（376 KB），不参与根 pnpm workspace。
  #
  # 2026-10-05：`lint` 修好了，所以本 job 现在也跑它。
  # 原先它必然失败（`--ext` 撞根 flat config + 根配置忽略整棵子树），
  # 已改为该目录自带一份 flat config 并去掉 `--ext`（`KT-GAP-33`）。
  auth-frontend:
    name: Auth frontend (lint + vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/go-user-system/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/go-user-system/frontend/package-lock.json

      # 用 npm ci 而不是 install：锁文件在版本控制里，必须是可复现安装。
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      # `build` 里含 `tsc`，所以它同时是一道类型检查。
      - name: Build (tsc + vite)
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: knowtrace
          POSTGRES_USER: knowtrace
          POSTGRES_PASSWORD: knowtrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowtrace -d knowtrace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # 与 quality job 同一套空库。Playwright 的 webServer 会起 `pnpm dev`。
      DATABASE_URL: postgres://knowtrace:knowtrace@localhost:5432/knowtrace
      AI_DEFAULT_PROVIDER: mock
      # 不配 AUTH_E2E_* / 管理员凭据：那 10 个需要真实账号的 spec 会自行 test.skip()。
      # 这是刻意的——见下方「为什么允许部分 skip」。

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to an empty database
        run: pnpm db:migrate

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e

      # 报告在成功时也要留痕——「跑过且全绿」本身就是证据。
      # 它是 KT-GAP-06 的正向验收产物（一次由 CI 自然触发的成功运行）。
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
