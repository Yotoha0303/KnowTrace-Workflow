name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Migrations, checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: knowtrace
          POSTGRES_USER: knowtrace
          POSTGRES_PASSWORD: knowtrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowtrace -d knowtrace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://knowtrace:knowtrace@localhost:5432/knowtrace
      AI_DEFAULT_PROVIDER: mock

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to an empty database
        run: pnpm db:migrate

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # 告警规则里的 `runbook:` 锚点必须能在目标文档里解析。
      # 规则与文档都在仓库里、是静态文件 —— 所以这个断言属于 CI，
      # 不需要服务器、不需要运行时，每次 push 自然发生。
      # 背景：告警响时人会点那个链接；锚点解析不到时**没有任何东西会报错**
      # （Prometheus 照样加载、告警照样 firing、health 照样 ok）。
      # 2026-10-06 实测抓到过一个：`#revision` 对不上中文标题的 slug。
      - name: Check alert runbook anchors
        run: node scripts/check-runbook-anchors.mjs

      - name: Run unit tests
        run: pnpm test

      # 覆盖率基线（KT-GAP-07）。
      # provider 故意**不写进 package.json**：先让 CI 每次采集，等基线稳定后再连同
      # 阈值一起固化（见 docs/08 §2.4）。版本从已装的 vitest 推导，避免与 vitest 错配。
      # 与上一步重复跑一次测试（约 +1 分钟）是有意的：`pnpm test` 是 CONTRIBUTING 的
      # 规范入口，不应因缺 provider 而失败。
      - name: Collect coverage baseline
        run: |
          VITEST_VERSION="$(node -p "require('vitest/package.json').version")"
          pnpm add -D "@vitest/coverage-v8@${VITEST_VERSION}"
          pnpm exec vitest run --coverage

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 14

      - name: Build production bundle
        run: pnpm build

  go:
    name: Go authentication service tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/go-user-system

    # 2026-10-17（ISSUE-S3-015 / ADR-0019 §5.2 ①）：本 job 原先**不配 TEST_DATABASE_DSN**，
    # 集成测试全部 t.Skipf（internal/testutil 的 OpenTestDB 在 DSN 为空时 skip）
    # ——「CI 全绿」里没有任何一条来自真实数据库，ADR-0019 §5.6 的每条负向判据都没有载体。现在补上了。
    # 2026-10-19（M3）：service 与 DSN 由 MySQL 换成 PostgreSQL，与主应用同方言（ADR-0019）。
    #
    # 本 job 有**两道**门，职责不同，别混着引用：
    #
    # 第一道（日志门，scripts/check-go-integration-gate.mjs）——**跳线，不是证据**：
    #   要求同时成立：① 日志里有 `REAL_DB_FINGERPRINT` 行；② 没有集成用例被 skip；
    #   ③ 带自有指纹的顶层集成用例 PASS >= 8；④ go test 自身的失败分类单列。
    #   ⚠️ **它防误配 / 疏忽，不防蓄意伪造。攻击成本 = 一行日志**：
    #   qa 已实测，在任何测试体里写一行 `t.Log("REAL_DB_FINGERPRINT …")` 或 `fmt.Println(…)`
    #   都会被 go test 归因到那条测试，假用例即可补上被删 / 被 skip 让出的槽位，甚至零连库全绿。
    #   **不得**把它的绿色引用为「集成测真的连过库」的证据。
    #
    # 第二道（服务端见证，scripts/check-go-integration-server-witness.mjs）——**这一道才是证据**：
    #   测试前后各一步，读 PostgreSQL 自己的 `pg_stat_database.sessions`（PG 14+ 的累计会话数），
    #   判**差值** >= 8。该计数只有「真的向该库建立连接」才涨，测试进程没有任何 SQL 能把它加一。
    #   ⚠️ 它证明的是「测试期间有过 8 次真实连接」，**不是**「是哪 8 条 Go 用例连的」——服务端没有测试名。
    #
    # ⚠️ 健康检查**刻意不带 `-d go_user_system_test`**：探的是维护库。`pg_isready` 本身不建会话
    #    （本机 PG 17.11 实测），但把探活指向被测库会让人误以为「探活也算连接计数」。
    # ⚠️ 库名必须是 go_user_system_test：testutil 的 assertTestDatabase 拒绝库名不含
    #    "test" 的库（internal/testutil/postgres.go），照抄 e2e 的 go_user_system 会直接 t.Fatalf。
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: go_user_system_test
          POSTGRES_USER: go_user_system
          POSTGRES_PASSWORD: knowtrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U go_user_system -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/go-user-system/go.mod
          cache-dependency-path: services/go-user-system/go.sum

      # 服务端见证（第一半）：**在测试之前**记下 PostgreSQL 的 sessions 基线。
      #
      # 为什么需要这一步：下面那道日志门只能核对「测试进程自己说的话」，一行 t.Log 即可伪造。
      # 真证据必须取自测试进程够不着的地方 —— PostgreSQL 的 pg_stat_database.sessions。
      # ⚠️ 判的是**差值**，不是绝对值：sessions 是累计值，绝对值与本轮测试无关。
      # ⚠️ 脚本自己连的是维护库 postgres（不是被测库），否则读数连接本身会给被测库 +1。
      # 口令走 PGPASSWORD 而不是 URL / 命令行，不出现在进程列表里。
      # ⚠️ 基线文件写在 workspace 根，与下面判定步共用同一个默认路径。
      - name: Capture the PostgreSQL server-side witness baseline
        working-directory: ${{ github.workspace }}
        env:
          PGPASSWORD: knowtrace
        run: >-
          node scripts/check-go-integration-server-witness.mjs --prepare
          --database go_user_system_test --admin-user go_user_system --port 5432

      # 与 Makefile 的 check 目标、CONTRIBUTING 的「提交前验证」保持一致。
      # 这个 job 之前缺失，导致认证服务的 26 个测试文件不在任何自动化门里。
      #
      # DSN 形态与 pkg/database/db.go 的 buildDSN 一致（gorm.io/driver/postgres 直接吃 PG URL）；
      # `timezone=UTC` 与 db.go 同样刻意钉住；库名含 "test" 是硬要求——见上面 service 块。
      #
      # `-count=1` 不可省：`go test` 会缓存**成功**的包，重跑时直接回放上次结果
      # （连测试函数体都不执行）。同一个 SHA 上重跑 CI 时，断言步会读到上一次的 PASS。
      # 它同时让 `(cached)` 在本次日志里不可能出现——断言步仍保留对它的检查，作为
      # 将来有人去掉这个参数时的纵深防御。
      #
      # `-json` 而不是 `-v`：断言步按事件（Action）计数，不按 `--- PASS:` 文本计数。
      # 文本判据抓不到缩进 4 空格的子测试 SKIP，也分不清真 PostgreSQL 与 fake driver。
      #
      # `set -o pipefail` 不可省：GitHub Actions 的 bash 默认带 `-e` 但**不带 pipefail**，
      # `go test … | tee` 会把测试失败的退出码吞成 tee 的 0。
      - name: Run Go tests
        env:
          TEST_DATABASE_DSN: "postgres://go_user_system:knowtrace@127.0.0.1:5432/go_user_system_test?sslmode=disable&timezone=UTC"
        run: |
          set -o pipefail
          go test ./... -count=1 -json 2>&1 | tee /tmp/go-test.jsonl

      # 证伪：证明集成测试**真的执行了**，而不是配了 DSN 却被 skip 掉、或被换成了 fake DB。
      # 为什么必须有这一步：`go test` 在用例 skip 时**退出码仍是 0**，
      # 于是「DSN 配错 → 全部 SKIP → CI 全绿」与「集成测真跑」在观测上完全同形。
      #
      # ⚠️ 本步是**跳线（tripwire），不是证据（proof）**——与上面两步的分工必须分清：
      #   它只核对「测试进程自己在日志里说了什么」。qa 已实测（2026-10-17，三个形态）：
      #   在任意测试体内写**一行** `t.Log("REAL_DB_FINGERPRINT …")` 或 `fmt.Println(…)`，
      #   go test 都会把这条输出归因到那条测试 ⇒ 假用例补上被删 / 被 skip 让出的槽位，
      #   甚至**零连库**也能全绿。**攻击成本 = 一行日志。**
      #   ⇒ **不得**把本步的绿色引用为「集成测真的连过库」的证据；那件事由下一步（服务端见证）负责。
      #   本步防的是**误配 / 疏忽**：DSN 没配、用例被无意跳过、fake driver 被误接上。
      #
      # 判据（四条，缺一不可；实现见 scripts/check-go-integration-gate.mjs）：
      #   ① 日志里必须有 `REAL_DB_FINGERPRINT database=… version=…` —— 它由 testutil.OpenTestDB
      #      向数据库要 current_database()/server_version 拼出（internal/testutil/postgres.go）。
      #   ② 任何被 SKIP 的集成用例（名字含 Integration，含子测试——JSON 里没有缩进可言）都失败。
      #   ③ **带自有指纹**的顶层集成用例 PASS **>= 8**。口径是指纹事件被 go test 归因（事件的 Test
      #      字段）到哪条测试，**不是**「名字里有没有 Integration」：后者会把走 fake driver、
      #      从未连库的 TestAcquireIntegrationLockSucceeds 也算进来，正好补掉「删/改名一条真用例」
      #      让出的那个槽位（qa 真跑证明：旧口径下 `-skip` 一条、或改名+skip 一条，门仍绿）。
      #      低于下界时**区分两种红**：`原因 (a)` = 有指纹但用例失败 / 跳过（偶发失败，
      #      看判据 ⓪ 与 ②）；`原因 (b)` = 有指纹但日志里连 FAIL 事件都没有（被改名 / 删除）。
      #      这两类在退出码上同形，修法完全不同。
      #   ④ go test 自身的失败单独报，不与 ③ 混为一谈：**构建失败**（FailedBuild 字段 / build-fail
      #      事件，按 import path 去重，同一次编译失败只报 1 条）、**用例失败**（包级 fail 但
      #      **没有** FailedBuild，例如 t.Fatalf——旧版把它误报成编译错误）、`(cached)` 各列一条。
      #
      # `if: always()` 不可省：否则 `Run Go tests` 失败时这一步被跳过，日志里就只剩
      # 「测试红了」而没有「集成测到底跑了几条」——正是诊断要的信息。
      #
      # `working-directory` 必须显式覆盖：本 job 的 defaults 是 services/go-user-system，
      # 而脚本在仓库根的 scripts/ 下。不覆盖会找不到脚本（node 报错退出，门会红，
      # 但红的原因与「集成测没跑」无关——那是门自己坏了）。
      - name: Assert the PostgreSQL integration tests actually ran (log tripwire)
        if: always()
        working-directory: ${{ github.workspace }}
        run: node scripts/check-go-integration-gate.mjs /tmp/go-test.jsonl

      # 服务端见证（第二半，**这一道才是证据**）：读 PostgreSQL 的 pg_stat_database.sessions，
      # 判「测试期间该库新增了多少次会话」，要求 >= 8。
      #
      # 为什么测试二进制伪造不了：sessions 没有写入接口——没有任何 SQL 能让它变大，
      # 只能真的向该库**建立连接**（本机 PG 17.11 实测：连 2 次 → +2）。它也不能被清零重来：
      # 本门同时比对 stats_reset，两次读数之间被重置即判不通过（重置需超级用户）。
      # ⚠️ 它证明「测试期间有过 8 次真实连接」，**不证明**「是哪 8 条 Go 用例连的」——服务端没有测试名。
      # ⚠️ `if: always()` 同理：`go test` 红了也要看服务端到底记了几次，那是第一手诊断信息。
      #    此时本步会因差值不足而红——**那是上游失败的下游结果**，脚本输出里已写明。
      - name: Assert the PostgreSQL server saw the integration connections
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          PGPASSWORD: knowtrace
        run: >-
          node scripts/check-go-integration-server-witness.mjs
          --database go_user_system_test --admin-user go_user_system
          --port 5432 --min-new-sessions 8

      # 兜底：上面两步的输出只活在 job 里；失败时把原始 JSON 日志留成工件，
      # 否则「门红了但看不出为什么」只能靠重跑。
      - name: Upload Go test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-jsonl
          path: /tmp/go-test.jsonl
          retention-days: 14

  # 认证服务的 React 前端（`services/go-user-system/frontend`）。
  # 与上面 go job 同形：**这个 job 之前也不存在**，导致它的 7 个 vitest 文件
  # （11 个用例）不在任何自动化门里 —— 根 vitest 的 include 只含 `src/**` 与 `tests/**`，
  # 这个目录两边都不是；CI 的三个 job 没有一个碰它。
  #
  # 它**不是本部署的运行时组件**：compose 无对应服务、go-user-system 的 Dockerfile
  # 只编译 Go 二进制、nginx/Caddy 也不引用它。加门不等于把它变成线上件 ——
  # 理由是「受版本控制的测试必须在门里」，见十环 `KT-GAP-32`。
  #
  # 为什么用 npm 而不是 pnpm：该目录是 `git subtree` 引入的上游仓库副本，
  # 自带 `package-lock.json`（376 KB），不参与根 pnpm workspace。
  #
  # 2026-10-05：`lint` 修好了，所以本 job 现在也跑它。
  # 原先它必然失败（`--ext` 撞根 flat config + 根配置忽略整棵子树），
  # 已改为该目录自带一份 flat config 并去掉 `--ext`（`KT-GAP-33`）。
  auth-frontend:
    name: Auth frontend (lint + vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/go-user-system/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/go-user-system/frontend/package-lock.json

      # 用 npm ci 而不是 install：锁文件在版本控制里，必须是可复现安装。
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      # `build` 里含 `tsc`，所以它同时是一道类型检查。
      - name: Build (tsc + vite)
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # 40 分钟：本 job 现在跑**两次**端到端（无认证 + 有认证），
    # 每次都要 `next build`，另外还多了一个 Go build 与认证服务启动。
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: knowtrace
          POSTGRES_USER: knowtrace
          POSTGRES_PASSWORD: knowtrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowtrace -d knowtrace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      # 2026-10-05（KT-GAP-41）：本 job 原先只有 postgres，日志服务**不在门里**，
      # 于是 tests/e2e 里那 8 个需要真实账号的 spec 全部 test.skip()。
      # 后果比 KT-GAP-33 修掉的那个 lint 假门更宽 ——
      # 「CI 全 success」当时并不等于「登录链路在门内验过」。
      #
      # 为什么不起 compose 整栈：本 job 只需要
      # 「一个能登录的账号」。认证服务是一个 Go 二进制（可以在 step 里直接起），
      # 不必为此引入 docker compose 的重栈。
      auth-postgres:
          # 2026-10-19（ADR-0019 M2/M3）：认证服务已改走 pgx，MySQL service 连不上。
          # 改用它自己的 PG 实例（与 go job 同形）；主应用的 postgres 在另一个 service 上。
          image: postgres:18-alpine
          env:
            POSTGRES_DB: go_user_system
            POSTGRES_USER: go_user_system
            POSTGRES_PASSWORD: knowtrace
          ports:
            - 5433:5432
          options: >-
            --health-cmd "pg_isready -U go_user_system -d go_user_system"
            --health-interval 5s
            --health-timeout 5s
            --health-retries 30
    env:
      # 与 quality job 同一套空库。Playwright 的 webServer 会起生产构建。
      DATABASE_URL: postgres://knowtrace:knowtrace@localhost:5432/knowtrace
      AI_DEFAULT_PROVIDER: mock

      # ---- 种子账号 ----------------------------------------------------------
      # **刻意不放在 job 级 `AUTH_E2E_*` 上** —— 那两个变量是 spec 眼里
      # 「有没有凭据」的开关。一旦 job 级设置，下面那次「无认证」运行也会去登录而失败。
      # 它们只出现在「Run the authenticated end-to-end tests」那一步的 env 里。
      #
      # 为什么账号名/口令**必须配对同一组值**：`AUTH_E2E_*` 是给 spec 登录用的，
      # 而账号是 `bootstrap-admin-if-needed` 建的。两处各写一份值就会
      # 「看起来配了、实际登不上」。
      KNOWTRACE_ADMIN_USERNAME: CiAdmin
      KNOWTRACE_ADMIN_PASSWORD: CiAdmin@Passw0rd-2026

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to an empty database
        run: pnpm db:migrate

      # 认证服务的迁移 + 管理员种子。两步都在 Go 二进制里（`migrate up` /
      # `bootstrap-admin-if-needed`），所以不需要把 compose 拉起来。
      - name: Migrate the authentication database
        working-directory: services/go-user-system
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5433"
          DB_USER: go_user_system
          DB_PASSWORD: knowtrace
          DB_NAME: go_user_system
          JWT_SECRET: ci_e2e_jwt_secret_at_least_32_characters_long
        run: go run ./cmd migrate up

      - name: Seed the end-to-end administrator
        working-directory: services/go-user-system
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5433"
          DB_USER: go_user_system
          DB_PASSWORD: knowtrace
          DB_NAME: go_user_system
          JWT_SECRET: ci_e2e_jwt_secret_at_least_32_characters_long
        # job 级 env 会被所有 step 继承，所以这里直接读 KNOWTRACE_ADMIN_*，
        # 只在 shell 层改名为认证服务要的 BOOTSTRAP_ADMIN_*。
        # 这样**凭据只有一处定义**，不会出现「配了却没配上」。
        run: |
          BOOTSTRAP_ADMIN_USERNAME="$KNOWTRACE_ADMIN_USERNAME"           BOOTSTRAP_ADMIN_PASSWORD="$KNOWTRACE_ADMIN_PASSWORD"             go run ./cmd bootstrap-admin-if-needed

      # 放宽**本 job** 的账号级登录限流。
      #
      # 为什么必须做：认证服务的 `config.yml` 是 `accountLimit: 5 / 15m`，
      # 而它**只从工作目录的 `config.yml` 读**（`cmd/main.go` 里 `loadConfig("config.yml")`），
      # **没有环境变量覆盖**。
      #
      # 而本 job 一旦让 spec 真的登录，次数就已超过 5：
      #   auth-flow / account-center / mobile-api / ai-runs-api 各 1 次 = 4，
      #   再加 knowledge-flow 与 sidebar-layout 的**条件登录**
      #   （`page.goto("/")` 后若落在 /login 就登录）= 6 次。
      # 也就是说，只把 AUTH_ENABLED=true 打开**必然**撞限流而全红 ——
      # 那不是「测出了问题」，是**门本身配错了**。
      #
      # 改的是**运行目录下的一份副本**，源文件不动（它服务于生产语义）。
      # 两个键在该文件里各只出现一次，所以直接按整行替换，不用正则。
      - name: Raise the login rate limit for this CI run
        working-directory: services/go-user-system
        run: |
          sed -i 's/^    accountLimit: 5$/    accountLimit: 500/; s/^    ipLimit: 20$/    ipLimit: 1000/' config.yml
          echo "CI 生效的登录限流："
          grep -A3 '^  loginRateLimit:' config.yml

      # 认证服务本身。`&` 后台起，然后**轮询 /readyz 直到就绪**——
      # 只 sleep 一个固定秒数会在慢 runner 上偶发失败，那种红是假红。
      - name: Start the authentication service
        working-directory: services/go-user-system
        env:
          APP_ENV: development
          APP_PORT: "8082"
          DB_HOST: 127.0.0.1
          DB_PORT: "5433"
          DB_USER: go_user_system
          DB_PASSWORD: knowtrace
          DB_NAME: go_user_system
          JWT_SECRET: ci_e2e_jwt_secret_at_least_32_characters_long
          REGISTRATION_ENABLED: "false"
          REDIS_ENABLED: "false"
          COOKIE_SECURE: "false"
        run: |
          go build -o /tmp/knowtrace-auth ./cmd
          nohup /tmp/knowtrace-auth > /tmp/knowtrace-auth.log 2>&1 &
          echo $! > /tmp/knowtrace-auth.pid
          for attempt in $(seq 1 60); do
            if curl -fsS -m 2 http://127.0.0.1:8082/readyz >/dev/null 2>&1; then
              echo "认证服务就绪（第 ${attempt} 次探测）"
              exit 0
            fi
            sleep 1
          done
          echo "认证服务在 60 秒内没有就绪 —— 以下是它的日志："
          cat /tmp/knowtrace-auth.log
          exit 1

      - name: Verify the seeded account exists and holds the admin role
        # 这一步是**证伪**，但刻意**不走登录接口**。
        #
        # 为什么不发一次真实登录来验：认证服务的账号级限流是
        # `config.yml` 的 `accountLimit: 5 / 15m`，**且没有环境变量覆盖**
        # （config.go 第 538 行是硬的默认值）。本 job 里那 4 个 spec 各登录一次
        # = 4 次，再加这一次校验就是 **5/5** —— 一点余量都没有。
        # 那种门在慢 runner 或将来多一个 spec 时会变成偶发红，是**脆弱的门**，
        # 比没有门更坏（会训练人忽略红色）。
        #
        # 改为直接查库断言「账号存在 + 已赋 admin 角色」：
        # 这不消耗限流预算，而且比登录更直接地证明「种子建对了」。
        env:
          PGPASSWORD: knowtrace
        run: |
          row="$(psql -h 127.0.0.1 -p 5433 -U go_user_system -d go_user_system -tA -c "
            SELECT u.username, string_agg(r.code, ',' ORDER BY r.code)
            FROM users u
            JOIN user_roles ur ON ur.user_id = u.id
            JOIN roles r ON r.id = ur.role_id
            WHERE u.username = '${KNOWTRACE_ADMIN_USERNAME}'
            GROUP BY u.username;")"
          if [[ -z "$row" ]]; then
            echo "库里没有账号 ${KNOWTRACE_ADMIN_USERNAME} —— 种子没建出来"
            exit 1
          fi
          roles="${row#*$'	'}"
          if [[ ",$roles," != *",admin,"* ]]; then
            echo "账号 ${KNOWTRACE_ADMIN_USERNAME} 存在，但没有 admin 角色（实际：${roles}）"
            exit 1
          fi
          echo "种子账号就位：${KNOWTRACE_ADMIN_USERNAME}（roles=${roles}）"

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # ---- 运行 1：**无认证**（与改动前语义完全一致）---------------------------
      # 这一步不设 AUTH_ENABLED=true / AUTH_E2E_*，所以：
      #   * 那 6 个**没有登录分支**的 spec（category-deletion / claim-workflow /
      #     knowledge-search / similar-captures / subject-timeline / topic-synthesis）
      #     照旧直接跑。它们**不能**在认证态下跑 —— `page.goto("/")` 会被 307 到登录页；
      #   * 需要账号的 spec 照旧 test.skip()（无凭据）。
      # 意义在于：「无认证」这条路径本身仍然被验证，没有因为引入认证态而丢掉。
      - name: Run the unauthenticated end-to-end tests
        env:
          AUTH_ENABLED: "false"
        run: pnpm test:e2e

      # ---- 运行 2：**有认证**（本次新增的能力）---------------------------------
      # 独立端口（3100）是硬要求：`reuseExistingServer` 若复用了上一次那个
      # **没有认证**的服务，这一步就名不副实，等于没测。
      # 只跑那 4 个真正需要账号的 spec，见 playwright.auth.config.ts 的说明。
      - name: Run the authenticated end-to-end tests
        env:
          AUTH_ENABLED: "true"
          AUTH_SERVICE_URL: http://127.0.0.1:8082
          AUTH_REGISTRATION_ENABLED: "false"
          AUTH_COOKIE_SECURE: "false"
          AUTH_E2E_USERNAME: ${{ env.KNOWTRACE_ADMIN_USERNAME }}
          AUTH_E2E_PASSWORD: ${{ env.KNOWTRACE_ADMIN_PASSWORD }}
          PLAYWRIGHT_PORT: "3100"
        run: pnpm exec playwright test --config playwright.auth.config.ts

      - name: Print authentication service log on failure
        if: failure()
        run: cat /tmp/knowtrace-auth.log || true

      # 报告在成功时也要留痕——「跑过且全绿」本身就是证据。
      # 它是 KT-GAP-06 的正向验收产物（一次由 CI 自然触发的成功运行）。
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-auth/
          retention-days: 14
